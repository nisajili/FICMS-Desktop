name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux-x64
            args: --linux --x64
          - os: windows-latest
            label: Windows-x64
            args: --win --x64
          - os: macos-13
            label: macOS-x64
            args: --mac --x64
          - os: macos-14
            label: macOS-arm64
            args: --mac --arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (incl. Electron binary)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --filter './packages/**' --filter './apps/**' build

      - name: Bundle embedded backend
        run: node scripts/bundle-backend.mjs

      - name: Package installers
        run: node scripts/run-electron-builder.mjs ${{ matrix.args }} --publish never

      - name: Generate SHA-256 checksums
        run: node scripts/gen-checksums.mjs apps/desktop/release

      - name: Generate SBOM
        run: node scripts/gen-sbom.mjs --out apps/desktop/release/sbom.cdx.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ficms-${{ matrix.label }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.dmg
            apps/desktop/release/*.pkg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
            apps/desktop/release/*.yaml
            apps/desktop/release/SHA256SUMS
            apps/desktop/release/sbom.cdx.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.msi
            artifacts/*.dmg
            artifacts/*.pkg
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.blockmap
            artifacts/*.yml
            artifacts/*.yaml
            artifacts/SHA256SUMS
            artifacts/sbom.cdx.json
