# FICMS desktop packaging configuration (electron-builder).
# Packaging runs on native OS runners in CI; the sandbox cannot download the
# Electron binary, so `dist:*` scripts are exercised there only.
appId: com.ficms.desktop
productName: FICMS
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
extraResources:
  # Embedded standalone backend (built @ficms/api + its runtime deps).
  - from: ../api/dist
    to: backend
  - from: ../api/node_modules
    to: backend/node_modules
asar: true
npmRebuild: false
publish: null

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: msi
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  category: public.app-category.medical
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: pkg
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  category: Science
  target:
    - AppImage
    - deb
    - rpm
  maintainer: FICMS
